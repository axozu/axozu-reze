<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>axozu</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #1a1720;
      user-select: none; -webkit-user-select: none;
    }
    #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: default; }

    #axozu {
      position: fixed; left: 50%; top: 80%;
      transform: translate(-50%, -50%);
      white-space: nowrap; pointer-events: none;
      opacity: 0; will-change: opacity, transform;
    }

    /* правый верхний угол: подсказка всегда видна, кнопки — при наведении слева от неё */
    .topbar {
      position: fixed; top: 10px; right: 10px;
      display: flex; align-items: center; gap: 8px;
    }
    .controls {
      display: flex; gap: 6px;
      opacity: 0; transition: opacity 0.25s ease;
    }
    body:hover .controls { opacity: 1; }

    .hint {
      height: 28px; padding: 0 12px; border-radius: 14px;
      display: flex; align-items: center;
      background: rgba(20, 16, 28, 0.32); backdrop-filter: blur(6px);
      color: rgba(246, 242, 238, 0.82);
      font: 300 12px/1 "Segoe UI", "Helvetica Neue", "Avenir Next", Helvetica, Arial, sans-serif;
      letter-spacing: 0.12em; white-space: nowrap;
      pointer-events: none;
      transition: color 0.2s ease, background 0.2s ease;
    }
    .hint b {
      font-weight: 600; color: #fff;
    }
    .hint.flash { background: rgba(20, 16, 28, 0.6); color: #fff; }
    .ctl {
      width: 28px; height: 28px; border: 0; border-radius: 50%; padding: 0;
      background: rgba(20, 16, 28, 0.45); color: #f3efff;
      backdrop-filter: blur(6px);
      display: grid; place-items: center; cursor: pointer;
      transition: background 0.15s ease;
    }
    .ctl:hover { background: rgba(20, 16, 28, 0.75); }
    #btn-close:hover { background: rgba(200, 50, 70, 0.85); }
    .ctl svg { width: 12px; height: 12px; stroke: currentColor; stroke-width: 1.6; fill: none; stroke-linecap: round; }

    #debug {
      position: fixed; left: 10px; top: 10px; display: none;
      font: 12px/1.4 Consolas, Menlo, monospace; white-space: pre;
      color: #e9ffe9; background: rgba(0, 0, 0, 0.55); padding: 6px 8px; border-radius: 4px;
      pointer-events: none;
    }
    .err {
      position: fixed; inset: 0; display: grid; place-items: center;
      color: #fff; font: 16px sans-serif;
    }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div id="axozu"></div>

  <div class="topbar">
  <div class="controls">
    <button class="ctl" id="btn-min" title="Свернуть" aria-label="Свернуть">
      <svg viewBox="0 0 12 12"><path d="M2 6h8"/></svg>
    </button>
    <button class="ctl" id="btn-close" title="Закрыть" aria-label="Закрыть">
      <svg viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg>
    </button>
  </div>
  <div class="hint" id="hint"><b>g</b>-color grading change</div>
  </div>

  <div id="debug"></div>

  <script src="easing.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
